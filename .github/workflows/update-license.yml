name: Update license

on:
  schedule:
    - cron: '0 3 1 1 *'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-license-year:
    name: Update copyright year(s) in license file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update license year(s) in license file
        uses: FantasticFiasco/action-update-license-year@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          labels: 'documentation'
